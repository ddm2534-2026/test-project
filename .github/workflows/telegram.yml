name: Пост в Telegram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать пост в логе, ничего не отправлять"
        type: boolean
        default: true
  # Ежедневную публикацию включим, когда посмотрим на первые посты:
  # schedule:
  #   - cron: "47 6 * * *"   # 08:47/09:47 по Израилю, после утреннего сбора

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Опубликовать скидки дня
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python scraper/post_telegram.py
