name: Пост в Telegram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать пост в логе, ничего не отправлять"
        type: boolean
        default: true
      lang:
        description: "Язык поста"
        type: choice
        options: [he, ru]
        default: he
      format:
        description: "Формат: carousel — альбом из слайдов, collage — одна картинка"
        type: choice
        options: [carousel, collage]
        default: carousel
  # Ежедневную публикацию включим, когда посмотрим на первые посты:
  # schedule:
  #   - cron: "47 6 * * *"   # 08:47/09:47 по Израилю, после утреннего сбора

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить Chromium для картинок
        run: |
          pip install playwright==1.*
          python -m playwright install --with-deps chromium

      - name: Опубликовать скидки дня
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TG_LANG: ${{ inputs.lang || 'he' }}
          TG_FORMAT: ${{ inputs.format || 'carousel' }}
          SLIDES_DIR: slides
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python scraper/post_telegram.py

      - name: Сохранить картинки поста (их можно скачать со страницы запуска)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-slides
          path: slides/
          if-no-files-found: ignore
