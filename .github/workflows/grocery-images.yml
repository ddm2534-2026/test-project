name: Фото товаров супермаркетов

on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * 0"   # раз в неделю, в воскресенье: новые товары подхватятся

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Подтянуть фото из выгрузки Open Food Facts
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper/grocery_images_bulk.py
