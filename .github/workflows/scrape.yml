name: Сбор скидок

on:
  workflow_dispatch:        # кнопка "Run workflow" во вкладке Actions
  schedule:
    - cron: "17 5 * * *"   # каждый день в 05:17 UTC (07:17/08:17 по Израилю)

permissions:
  contents: write           # чтобы закоммитить обновлённые data/deals.*

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать скидки
        env:
          SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
        run: python scraper/scrape_deals.py

      - name: Сохранить результат в репозиторий
        if: always()
        run: |
          if [ -d data ] && [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Обновить скидки $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Изменений нет"
          fi
