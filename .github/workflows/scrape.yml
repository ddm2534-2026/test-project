name: Сбор скидок

on:
  workflow_dispatch:        # кнопка "Run workflow" во вкладке Actions
  schedule:
    - cron: "17 5 * * *"   # каждый день в 05:17 UTC (07:17/08:17 по Израилю)

permissions:
  contents: write           # чтобы закоммитить обновлённые data/deals.*
  pages: write              # чтобы выложить страницу на GitHub Pages
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать скидки
        env:
          SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
        run: python scraper/scrape_deals.py

      - name: Сохранить результат в репозиторий
        if: always()
        run: |
          if [ -d data ] && [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Обновить скидки $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Изменений нет"
          fi

      - name: Собрать страницу «Скидки сегодня»
        run: python scraper/build_site.py

      - name: Подготовить страницу к публикации
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: scrape
    runs-on: ubuntu-latest
    # Пока GitHub Pages не включён в настройках репозитория, этот шаг
    # не сработает, но и не пометит весь сбор как упавший.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Выложить на GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
