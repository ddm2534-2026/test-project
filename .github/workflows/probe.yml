name: Разведка магазинов

on:
  workflow_dispatch:   # только вручную
    inputs:
      what:
        description: "Что проверять"
        type: choice
        options: [stores, supermarkets, grocery]
        default: stores

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить сайты магазинов
        run: |
          if [ "${{ inputs.what }}" = "grocery" ]; then pip install -q israeli-prices || true; python scraper/probe_grocery.py
          elif [ "${{ inputs.what }}" = "supermarkets" ]; then python scraper/probe_supermarkets.py
          else python scraper/probe_stores.py; fi
      - name: Сохранить результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add research
          git commit -m "Разведка (${{ inputs.what }}) $(date -u +%Y-%m-%d)" || echo "Изменений нет"
          git pull --rebase && git push
