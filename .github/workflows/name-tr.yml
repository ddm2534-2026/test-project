name: Перевод названий и карточек товаров (ru, en)

on:
  workflow_dispatch:
    inputs:
      langs:
        description: "языки через пробел"
        type: string
        default: "ru en"
      action:
        description: "warm — названия товаров, warm_info — карточки (состав, аллергены)"
        type: choice
        options: [warm, warm_info]
        default: warm
      threads:
        description: "параллельных потоков на язык"
        type: string
        default: "3"
  schedule:
    - cron: "40 5 * * *" # после ночной загрузки прайсов — переводим новые названия
    - cron: "20 4-9 * * *" # каждый час, пока утром собираются карточки Шуферсаля — переводим их

concurrency:
  group: name-tr-${{ inputs.action || github.event.schedule }}
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Перевод
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LANGS: ${{ inputs.langs || 'ru en' }}
          THREADS: ${{ inputs.threads || (github.event.schedule == '20 4-9 * * *' && '1') || '3' }}
          ACTION: ${{ inputs.action || (github.event.schedule == '20 4-9 * * *' && 'warm_info') || 'warm' }}
        run: |
          loop() { # $1 язык, $2 номер потока
            for n in $(seq 1 200); do
              r=$(curl -sS --max-time 150 -X POST "$SUPABASE_URL/functions/v1/name-tr" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" -d "{\"action\":\"$ACTION\",\"lang\":\"$1\"}" || echo '{"error":"curl"}')
              echo "[$1/$2 #$n] $r"
              echo "$r" | grep -q '"left":0\|forbidden' && break
              echo "$r" | grep -q '"error"' && sleep 20
            done
          }
          for l in $LANGS; do for t in $(seq 1 $THREADS); do loop "$l" "$t" & done; done
          wait
