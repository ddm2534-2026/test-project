name: Цены супермаркетов

on:
  workflow_dispatch:
    inputs:
      chains:
        description: "Какие сети (через пробел; пусто — все)"
        type: string
        default: ""
  schedule:
    - cron: "37 6 * * *"   # 08:37 по Израилю (зимой): к этому времени все сети выложили свежие файлы

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Загрузить цены и акции в базу
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper/grocery_ingest.py ${{ inputs.chains }}
