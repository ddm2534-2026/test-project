name: Разметка товаров под рецепты

on:
  workflow_dispatch:
    inputs:
      action:
        description: "backfill — ключи для рецептов библиотеки и разметка всех ингредиентов; tag_new — только новые товары"
        type: choice
        options: [backfill, tag_new, seed, school_check, tax_propose, classify]
        default: backfill
      category:
        description: "для tax_propose/classify: категория товаров (dairy, sweets, drinks, pantry, produce, meat, frozen, coffee, bakery, cleaning, care, baby, pets, other); для tax_propose можно несколько через пробел"
        type: string
        default: ""
      per_meal:
        description: "для seed: сколько рецептов на категорию"
        type: string
        default: "40"
      meals:
        description: "для seed: только эти категории через запятую (пусто — все)"
        type: string
        default: ""

# запуски идут по очереди, чтобы не размечать одно и то же одновременно
concurrency:
  group: menu-admin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Разметка
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.action }}" = "seed" ]; then
            python scraper/menu_seed.py "${{ inputs.per_meal }}" "${{ inputs.meals }}"
          else
            scraper/menu_admin.sh ${{ inputs.action }} "${{ inputs.category }}"
          fi
