<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корзина на неделю — где дешевле</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fbf7f2; --card:#fff; --ink:#24201c; --muted:#7a7068; --line:#e6ddd2; --accent:#e0503a;
          --vip:#5b3fc8; --good:#22704a; --pad:20px; --side:360px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 Rubik, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  .wrap { max-width:1320px; margin:0 auto; padding-inline:var(--pad); }
  button { font:inherit; color:inherit; }
  .he { direction:rtl; unicode-bidi:isolate; }
  .ltr { direction:ltr; unicode-bidi:isolate; }

  header.wrap { padding-top:24px; padding-bottom:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .eyebrow { font-size:13px; font-weight:500; color:var(--muted); }
  h1 { margin:4px 0 0; font-size:clamp(30px,5vw,42px); line-height:1.05; font-weight:800; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  .meta { color:var(--muted); margin-top:6px; font-size:14px; }
  .lang { flex-shrink:0; height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:13px; cursor:pointer; }

  .layout { display:flex; gap:20px; align-items:flex-start; padding-bottom:40px; }
  .catalog { flex:1; min-width:0; }
  aside { width:var(--side); flex-shrink:0; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto;
          display:flex; flex-direction:column; gap:14px; padding-bottom:4px; }

  .toolbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(8px);
             padding:8px 0 10px; display:flex; flex-direction:column; gap:10px; }
  .search { display:flex; align-items:center; gap:8px; height:44px; padding:0 14px; border:1px solid var(--line); border-radius:14px; background:var(--card); }
  .search:focus-within { border-color:var(--ink); }
  .search input { border:0; outline:0; flex:1; min-width:0; font:inherit; font-size:15px; background:transparent; }
  .chips { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chip { flex-shrink:0; white-space:nowrap; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:14px; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip.deal[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); }

  .cats { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:10px; margin:6px 0 16px; }
  .cat { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px 10px; border-radius:16px; border:2px solid transparent;
         background:var(--card); cursor:pointer; box-shadow:0 1px 0 #ece4da; text-align:center; min-height:44px; }
  .cat[aria-pressed="true"] { border-color:var(--ink); }
  .cat .ic { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; }
  .cat .ic svg { width:26px; height:26px; }
  .cat b { font-size:12.5px; font-weight:500; line-height:1.2; }
  .cat small { font-size:11px; color:var(--muted); }

  .head2 { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:2px 0 10px; }
  .head2 h2 { margin:0; font-size:18px; }
  .head2 span { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px; }
  .card { background:var(--card); border-radius:18px; overflow:hidden; display:flex; flex-direction:column;
          box-shadow:0 1px 0 #ece4da, 0 6px 18px rgba(60,40,20,.06); cursor:grab; transition:transform .12s ease, box-shadow .12s ease; }
  .card:hover { transform:translateY(-2px); box-shadow:0 1px 0 #ece4da, 0 12px 26px rgba(60,40,20,.12); }
  .card.dragging { opacity:.5; }
  .card .pic { position:relative; height:92px; display:grid; place-items:center; }
  .card .pic svg { width:40px; height:40px; opacity:.85; }
  .card .badge { position:absolute; top:8px; inset-inline-start:8px; background:var(--accent); color:#fff; font-weight:700; font-size:11px;
                 padding:3px 7px; border-radius:8px; max-width:calc(100% - 16px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .card .nm { font-size:13.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em; }
  .card .sub { font-size:11.5px; color:var(--muted); }
  .card .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:4px; }
  .card .price { font-size:17px; font-weight:800; }
  .card .price small { font-size:11px; font-weight:500; color:var(--muted); }
  .add { width:40px; height:40px; border-radius:50%; border:0; background:var(--ink); color:#fff; font-size:22px; cursor:pointer; line-height:1; flex-shrink:0; }
  .stepper { display:flex; align-items:center; gap:2px; background:var(--ink); color:#fff; border-radius:999px; padding:2px; }
  .stepper button { width:32px; height:36px; border:0; background:transparent; color:#fff; font-size:18px; cursor:pointer; }
  .stepper span { min-width:18px; text-align:center; font-weight:700; }
  .more { display:block; margin:20px auto 0; height:44px; padding:0 24px; border-radius:999px; border:1.5px solid var(--ink); background:var(--card); cursor:pointer; }
  .more[hidden] { display:none; }
  .empty { color:var(--muted); font-size:14px; padding:10px 0; }

  .panel { background:var(--card); border-radius:18px; box-shadow:0 1px 0 #ece4da, 0 6px 18px rgba(60,40,20,.06); padding:14px; }
  .panel h2 { margin:0 0 8px; font-size:16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .drop { border:2px dashed transparent; transition:border-color .1s, background .1s; }
  .drop.over { border-color:var(--accent); background:#fff6f3; }
  .bline { display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid #f1ebe3; }
  .bline:first-child { border-top:0; }
  .bline .ic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex-shrink:0; }
  .bline .ic svg { width:18px; height:18px; }
  .bline .nm { flex:1; min-width:0; font-size:13px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qty { display:flex; align-items:center; gap:2px; }
  .qty button { width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:16px; cursor:pointer; }
  .qty span { min-width:20px; text-align:center; font-weight:600; font-size:14px; }
  .clear { border:0; background:none; color:var(--muted); font-size:12.5px; cursor:pointer; text-decoration:underline; }
  details.settings summary { cursor:pointer; font-weight:700; font-size:15px; list-style:none; display:flex; justify-content:space-between; }
  details.settings summary::after { content:'⌄'; color:var(--muted); }
  details[open].settings summary::after { content:'⌃'; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); }
  select, input[type=date], input[type=number] { font:inherit; font-size:14px; border:1px solid var(--line); border-radius:10px; padding:6px 8px; background:var(--card); color:var(--ink); }
  .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-top:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th, td { padding:5px 3px; text-align:start; border-top:1px solid #f1ebe3; vertical-align:middle; }
  th { font-weight:500; color:var(--muted); font-size:11.5px; border-top:0; }
  td input[type=number] { width:62px; padding:4px 6px; }
  td input[type=checkbox] { width:18px; height:18px; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  .plan { border:2px solid var(--ink); }
  .total { font-size:28px; font-weight:800; }
  .saving { color:var(--good); font-weight:600; font-size:13.5px; }
  .chain-block { margin-top:10px; padding-top:10px; border-top:1px solid #f1ebe3; }
  .chain-block h3 { margin:0 0 4px; font-size:14.5px; display:flex; justify-content:space-between; gap:8px; }
  .line { display:flex; gap:8px; font-size:13px; padding:2px 0; }
  .line .nm { flex:1; min-width:0; }
  .line .deal-note { display:block; font-size:11.5px; color:#b23b27; }
  .cmp td.best { font-weight:700; color:var(--good); }

  /* мобильная корзина: панель снизу + выезжающий лист */
  .mbar { display:none; }
  @media (max-width: 900px) {
    :root { --pad:16px; }
    aside { position:fixed; inset:0; width:auto; max-height:none; z-index:20; background:var(--bg); padding:16px; transform:translateY(100%);
            transition:transform .2s ease; overflow:auto; }
    aside.open { transform:none; }
    .close-sheet { display:inline-flex !important; }
    .mbar { display:flex; position:fixed; left:12px; right:12px; bottom:12px; z-index:15; height:56px; border-radius:18px; border:0;
            background:var(--ink); color:#fff; align-items:center; justify-content:space-between; padding:0 18px; font-size:15px; font-weight:600;
            box-shadow:0 8px 24px rgba(0,0,0,.2); cursor:pointer; }
    .layout { padding-bottom:90px; }
    .chips { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin-inline:calc(-1 * var(--pad)); padding-inline:var(--pad); }
    .chips::-webkit-scrollbar { display:none; }
    .cats { grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:96px; overflow-x:auto; scrollbar-width:none;
            margin-inline:calc(-1 * var(--pad)); padding-inline:var(--pad); }
    .cats::-webkit-scrollbar { display:none; }
    .grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  }
  .close-sheet { display:none; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); cursor:pointer; align-self:flex-end; }
  footer.wrap { padding-bottom:40px; color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<header class="wrap">
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <div class="meta" id="meta"></div>
  </div>
  <button class="lang" id="lang"></button>
</header>

<div class="wrap layout">
  <main class="catalog">
    <div class="toolbar">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a7068" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" dir="auto" autocomplete="off">
      </label>
      <div class="chips" id="chainChips"></div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="head2"><h2 id="listTitle"></h2><span id="listCount"></span></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
    <button class="more" id="more" hidden></button>
  </main>

  <aside id="side">
    <button class="close-sheet" id="closeSheet"></button>
    <section class="panel drop" id="drop">
      <h2><span id="basketTitle"></span><button class="clear" id="clear"></button></h2>
      <div id="basket"></div>
    </section>
    <section class="panel">
      <details class="settings" id="settingsBox">
        <summary id="settingsTitle"></summary>
        <div class="grid2">
          <label class="f"><span id="lblDeliveries"></span>
            <select id="deliveries"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
          <label class="f"><span id="lblDate"></span><input type="date" id="date"></label>
        </div>
        <table>
          <thead><tr><th id="thChain"></th><th id="thUse"></th><th id="thClub"></th><th id="thFee"></th><th id="thMin"></th></tr></thead>
          <tbody id="chainsTable"></tbody>
        </table>
        <div class="hint" id="settingsHint"></div>
      </details>
    </section>
    <section class="panel plan" id="planPanel" hidden><div id="plan"></div></section>
    <section class="panel" id="cmpPanel" hidden>
      <h2 id="cmpTitle"></h2>
      <table class="cmp"><thead><tr><th id="thCmpChain"></th><th id="thCmpTotal"></th><th id="thCmpMissing"></th></tr></thead><tbody id="cmp"></tbody></table>
    </section>
  </aside>
</div>
<button class="mbar" id="mbar"><span id="mbarLeft"></span><span id="mbarRight" class="ltr"></span></button>

<footer class="wrap" id="footer"></footer>

<script>
// Публичный ключ: только чтение (права настроены в базе)
const SUPABASE_URL = '/*__SUPABASE_URL__*/';
const SUPABASE_KEY = '/*__SUPABASE_KEY__*/';
const PAGE = 48;

        coffee: 'קפה ותה', sweets: 'חטיפים ומתוקים', frozen: 'קפואים', pantry: 'מזווה', cleaning: 'ניקיון ובית',
        care: 'טיפוח ופארם', baby: 'תינוקות', pets: 'חיות מחמד', other: 'אחר' },
};

const T = {

    planTitle: k => k === 1 ? 'הכי משתלם — משלוח אחד' : `הכי משתלם — ${k} משלוחים`,
    total: 'סה״כ כולל משלוח', delivery: 'משלוח',
    vsBest1: (s, c) => `חיסכון של ${s} לעומת הרשת המשתלמת ביותר לבד (${c})`,
    noPlan: 'אין אפשרות מתאימה: חלק מהמוצרים חסרים ברשתות שנבחרו או שלא מגיעים למינימום.',
    cmp: 'הכל ברשת אחת', cmpChain: 'רשת', cmpTotal: 'סה״כ', cmpMissing: 'חסרים',
    minFail: (c, m) => `${c}: לא מגיעים למינימום ${m}`, clubDeal: 'מועדון',
    mbar: n => `הסל · ${n}`, close: 'סגירה',
    footer: 'המחירים והמבצעים מקבצי השקיפות שהרשתות מחויבות לפרסם (שופרסל ורמי לוי — אונליין, השאר — סניף גדול). הקטגוריות נקבעו אוטומטית לפי השם. מתעדכן פעם ביום — בדקו את המחיר באתר הרשת לפני ההזמנה.',
    switchTo: 'Русский',
  },
};
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

let lang = (() => { const q = new URLSearchParams(location.search).get('lang'); if (q === 'ru' || q === 'he') return q; return store('basketLang') === 'he' ? 'he' : 'ru'; })();
let L = T[lang];

let basket = store('basket') || {};                       // {barcode: qty}
let known = store('basketItems') || {};                   // {barcode: {name, category}} — для показа корзины до загрузки
let settings = store('basketSettings') || { chains: {}, deliveries: 2 };
const view = { category: null, chain: null, q: '', deals: false, offset: 0, total: 0 };
let rows = [], data = null, chains = [], catCounts = [], reqId = 0;

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
const money = n => new Intl.NumberFormat(L.locale, { style: 'currency', currency: 'ILS',
  minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 }).format(n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chainName = id => { const c = chains.find(x => x.id === id); return c ? (lang === 'he' ? c.name_he : c.name) : id; };
const cfg = id => (settings.chains[id] ||= { use: true, club: false, fee: '', min: '' });
const itemInfo = b => (data?.items || []).find(i => i.barcode === b) || known[b] || { name: b };

// ---------- расчёт ----------
// Стоимость набора товаров в одной сети с учётом акций.
// Акция в единой форме: на каждые qty штук платим total ₪ (если задано) или fraction × обычная цена.
// Штуки разных товаров одной акции суммируются («любые 3 йогурта»); в группы идут самые дорогие штуки.
function chainCost(chainId, lines, date) {
  const priceOf = {}, dealsOf = {};
  for (const p of data.prices || []) if (p.chain === chainId) priceOf[p.barcode] = Number(p.price);
  for (const d of data.deals || []) {
    if (d.chain !== chainId || !d.qty) continue;
    if (d.club && !cfg(chainId).club) continue;
    if (d.min_purchase && Number(d.min_purchase) > 0) continue;   // акции «при покупке от X ₪» пока не считаем
    if (date && d.ends && d.ends.slice(0, 10) < date) continue;
    (dealsOf[d.barcode] ||= []).push(d);
  }
  const missing = [], out = [];
  let regularSum = 0;
  // для каждого товара выбираем самую выгодную акцию (если товар один в акции)
  const pools = {};
  for (const { barcode, qty } of lines) {
    const price = priceOf[barcode];
    if (price == null) { missing.push(barcode); continue; }
    regularSum += price * qty;
    let best = null, bestCost = price * qty;
    for (const d of dealsOf[barcode] || []) {
      const c = applyDeal(d, Array(qty).fill(price));
      if (c < bestCost - 0.005) { best = d; bestCost = c; }
    }
    const line = { barcode, qty, price, regular: price * qty, cost: price * qty, deal: null };
    out.push(line);
    if (best) (pools[best.promo] ||= { deal: best, lines: [] }).lines.push(line);
  }
  // общий расчёт по каждой акции (штуки разных товаров вместе)
  for (const { deal, lines: ls } of Object.values(pools)) {
    const units = ls.flatMap(l => Array(l.qty).fill(l.price));
    const total = applyDeal(deal, units), regular = units.reduce((a, b) => a + b, 0);
    if (total >= regular - 0.005) continue;
    // распределяем экономию по строкам пропорционально обычной стоимости
    for (const l of ls) { l.cost = l.regular * total / regular; l.deal = deal; }
  }
  const goods = out.reduce((a, l) => a + l.cost, 0);
  return { chainId, lines: out, missing, goods, regularSum };
}

function applyDeal(d, unitPrices) {
  const q = Math.max(1, Math.round(Number(d.qty)));
  const units = [...unitPrices].sort((a, b) => b - a);   // дорогие штуки — в акцию
  const groups = Math.floor(units.length / q);
  let cost = 0;
  for (let g = 0; g < groups; g++) {
    const grp = units.slice(g * q, g * q + q);
    const reg = grp.reduce((a, b) => a + b, 0);
    const c = d.total != null ? Number(d.total) : reg * Number(d.fraction);
    cost += Math.min(c, reg);
  }
  for (let i = groups * q; i < units.length; i++) cost += units[i];
  return cost;
}

function subsets(arr, k) {
  const res = [];
  const rec = (start, cur) => {
    if (cur.length) res.push([...cur]);
    if (cur.length === k) return;
    for (let i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
  };
  rec(0, []);
  return res;
}

function solve() {
  const lines = Object.entries(basket).map(([barcode, qty]) => ({ barcode, qty }));
  const date = document.getElementById('date').value;
  const used = chains.filter(c => cfg(c.id).use).map(c => c.id);
  const fee = id => Number(cfg(id).fee) || 0, minOrder = id => Number(cfg(id).min) || 0;

  // цена каждой строки в каждой сети — сначала поштучно, чтобы распределить товары
  const single = {};
  for (const id of used) single[id] = chainCost(id, lines, date);
  const lineCost = (id, b) => { const l = single[id].lines.find(x => x.barcode === b); return l ? l.cost : Infinity; };

  let best = null;
  for (const set of subsets(used, Number(document.getElementById('deliveries').value))) {
    const assign = {};
    let ok = true;
    for (const { barcode } of lines) {
      let bestId = null, bestC = Infinity;
      for (const id of set) { const c = lineCost(id, barcode); if (c < bestC) { bestC = c; bestId = id; } }
      if (bestId == null) { ok = false; break; }
      (assign[bestId] ||= []).push(lines.find(l => l.barcode === barcode));
    }
    if (!ok) continue;
    const parts = Object.entries(assign).map(([id, ls]) => ({ ...chainCost(id, ls, date), fee: fee(id) }));
    if (parts.length !== set.length) continue;             // сеть без товаров — это вариант поменьше, он посчитан отдельно
    const minIssues = parts.filter(p => p.goods < minOrder(p.chainId)).map(p => L.minFail(chainName(p.chainId), money(minOrder(p.chainId))));
    if (minIssues.length) continue;
    const total = parts.reduce((a, p) => a + p.goods + p.fee, 0);
    if (!best || total < best.total - 0.005) best = { parts, total };
  }

  // всё в одной сети — для сравнения
  const cmp = used.map(id => {
    const s = single[id];
    return { id, total: s.goods + fee(id), missing: s.missing.length, minOk: s.goods >= minOrder(id) };
  }).sort((a, b) => (a.missing - b.missing) || (a.total - b.total));
  return { best, cmp, lines };
}


// ---------- каталог ----------
async function loadCats() {
  catCounts = await rpc('g_categories', { p_chain: view.chain });
  drawCats();
}
async function loadList(append) {
  const my = ++reqId;
  if (!append) view.offset = 0;
  const page = await rpc('g_browse', { p_category: view.category, p_chain: view.chain, p_q: view.q || null,
                                       p_deals: view.deals, p_limit: PAGE, p_offset: view.offset });
  if (my !== reqId) return;
  rows = append ? rows.concat(page) : page;
  view.total = page.length ? Number(page[0].total) : (append ? view.total : 0);
  view.offset += page.length;
  page.forEach(r => { known[r.barcode] = { name: r.name, category: r.category }; });
  drawList();
}

function drawStatic() {
  document.documentElement.lang = lang; document.documentElement.dir = L.dir; document.title = L.title;
  const set = (id, v, html) => { const el = document.getElementById(id); if (el) html ? (el.innerHTML = v) : (el.textContent = v); };
  set('eyebrow', L.eyebrow); set('h1', L.h1, true); set('lang', L.switchTo);
  const q = document.getElementById('q'); q.placeholder = L.search; q.setAttribute('aria-label', L.search);
  set('basketTitle', L.basket); set('clear', L.clear); set('settingsTitle', L.settings);
  set('lblDeliveries', L.deliveries); set('lblDate', L.date); set('thChain', L.chain); set('thUse', L.use);
  set('thClub', L.club); set('thFee', L.fee); set('thMin', L.min); set('settingsHint', L.settingsHint);
  set('cmpTitle', L.cmp); set('thCmpChain', L.cmpChain); set('thCmpTotal', L.cmpTotal); set('thCmpMissing', L.cmpMissing);
  set('footer', L.footer); set('more', L.more); set('empty', L.empty); set('closeSheet', L.close);
  if (chains.length) {
    const d = chains.map(c => c.prices_at).sort().pop();
    set('meta', L.meta(chains.length, new Date(d).toLocaleDateString(L.locale, { day: 'numeric', month: 'long' })));
  }
}

function drawChainChips() {
  const chip = (label, pressed, on, cls = '') => `<button class="chip ${cls}" aria-pressed="${pressed}" data-chain="${on}">${esc(label)}</button>`;
  document.getElementById('chainChips').innerHTML =
    chip(L.allChains, !view.chain, '') + chains.map(c => chip(chainName(c.id), view.chain === c.id, c.id)).join('') +
    `<button class="chip deal" aria-pressed="${view.deals}" id="dealsChip">${esc(L.deals)}</button>`;
}

function drawCats() {
  const counts = Object.fromEntries(catCounts.map(c => [c.category, Number(c.n)]));
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const tile = (id, label, n) => `<button class="cat" aria-pressed="${view.category === id}" data-cat="${id ?? ''}">
      <span class="ic" style="background:${tint(id || 'other')}">${id ? svg(id) : svg('other')}</span>
      <b>${esc(label)}</b><small>${n.toLocaleString(L.locale)}</small></button>`;
  document.getElementById('cats').innerHTML = tile(null, L.allCats, total) +
    CAT_ORDER.filter(c => counts[c]).map(c => tile(c, CAT[lang][c], counts[c])).join('');
}

function drawList() {
  document.getElementById('listTitle').textContent = view.category ? CAT[lang][view.category] : L.allCats;
  document.getElementById('listCount').textContent = L.found(view.total);
  document.getElementById('grid').innerHTML = rows.map(cardHtml).join('');
  document.getElementById('empty').hidden = rows.length > 0;
  document.getElementById('more').hidden = view.offset >= view.total;
}

function cardHtml(r) {
  const q = basket[r.barcode] || 0;
  const priceHtml = view.chain
    ? (r.chain_price != null ? money(r.chain_price) : `<small>${L.notHere}</small>`)
    : (Number(r.max_price) > Number(r.min_price) ? `<small>${L.from}</small> ${money(r.min_price)}` : money(r.min_price));
  const ctl = q
    ? `<div class="stepper"><button data-dec="${esc(r.barcode)}" aria-label="−">−</button><span>${q}</span><button data-inc="${esc(r.barcode)}" aria-label="+">+</button></div>`
    : `<button class="add" data-inc="${esc(r.barcode)}" aria-label="+">+</button>`;
  const deal = r.deal_text ? `<span class="badge he" title="${esc(r.deal_text)}">${esc(r.deal_text)}</span>` : '';
  const maker = r.maker && !/לא ידוע|כללי/.test(r.maker) ? esc(r.maker) + ' · ' : '';
  const where = r.deal_text && !view.chain ? ` · <b style="color:#b23b27;font-weight:600">%&nbsp;${esc(chainName(r.deal_chain))}</b>` : '';
  return `<article class="card" draggable="true" data-barcode="${esc(r.barcode)}">
    <div class="pic" style="background:${tint(r.category)}">${svg(r.category)}${deal}</div>
    <div class="body">
      <div class="nm he">${esc(r.name)}</div>
      <div class="sub">${maker}${L.inChains(r.n_chains)}${where}</div>
      <div class="row"><span class="price ltr">${priceHtml}</span>${ctl}</div>
    </div></article>`;
}

// ---------- корзина ----------
function setQty(b, q) {
  if (q <= 0) delete basket[b]; else basket[b] = q;
  store('basket', basket); store('basketItems', known);
  document.querySelectorAll(`.card[data-barcode="${CSS.escape(b)}"]`).forEach(el => {
    const r = rows.find(x => x.barcode === b); if (r) el.outerHTML = cardHtml(r);
  });
  drawBasket();
  refreshBasketData();
}
let bt;
function refreshBasketData() {
  clearTimeout(bt);
  bt = setTimeout(async () => {
    data = await rpc('g_basket', { p_barcodes: Object.keys(basket) });
    if (data.chains && !chains.length) chains = data.chains.sort((a, b) => a.name.localeCompare(b.name));
    drawBasket(); drawPlan();
  }, 200);
}
function drawBasket() {
  const codes = Object.keys(basket);
  const n = codes.reduce((a, b) => a + basket[b], 0);
  document.getElementById('basket').innerHTML = codes.length ? codes.map(b => {
    const i = itemInfo(b), cat = i.category || known[b]?.category || 'other';
    return `<div class="bline"><span class="ic" style="background:${tint(cat)}">${svg(cat)}</span>
      <span class="nm he" title="${esc(i.name)}">${esc(i.name)}</span>
      <div class="qty"><button data-dec="${esc(b)}" aria-label="−">−</button><span>${basket[b]}</span><button data-inc="${esc(b)}" aria-label="+">+</button></div></div>`;
  }).join('') : `<div class="empty">${L.basketEmpty}</div>`;
  document.getElementById('clear').hidden = !codes.length;
  document.getElementById('mbarLeft').textContent = L.mbar(n);
}

function drawChainsTable() {
  document.getElementById('chainsTable').innerHTML = chains.map(c => {
    const s = cfg(c.id), nm = esc(chainName(c.id));
    return `<tr><td>${nm}</td>
      <td><input type="checkbox" data-k="use" data-c="${c.id}" ${s.use ? 'checked' : ''} aria-label="${esc(L.use)} ${nm}"></td>
      <td><input type="checkbox" data-k="club" data-c="${c.id}" ${s.club ? 'checked' : ''} aria-label="${esc(L.club)} ${nm}"></td>
      <td><input type="number" min="0" step="1" inputmode="decimal" data-k="fee" data-c="${c.id}" value="${esc(s.fee)}" aria-label="${esc(L.fee)} ${nm}"></td>
      <td><input type="number" min="0" step="1" inputmode="decimal" data-k="min" data-c="${c.id}" value="${esc(s.min)}" aria-label="${esc(L.min)} ${nm}"></td></tr>`;
  }).join('');
}

function drawPlan() {
  const panel = document.getElementById('planPanel'), cmpPanel = document.getElementById('cmpPanel');
  if (!Object.keys(basket).length || !data || !data.prices) { panel.hidden = cmpPanel.hidden = true; document.getElementById('mbarRight').textContent = ''; return; }
  const { best, cmp } = solve();
  panel.hidden = false;
  if (!best) { document.getElementById('plan').innerHTML = `<div class="empty">${L.noPlan}</div>`; }
  else {
    const one = cmp.find(c => c.missing === 0 && c.minOk);
    const saving = one ? one.total - best.total : 0;
    document.getElementById('plan').innerHTML = `
      <h2>${L.planTitle(best.parts.length)}</h2>
      <div class="hint" style="margin-top:0">${L.total}</div>
      <div class="total ltr">${money(best.total)}</div>
      ${saving > 0.5 ? `<div class="saving">${L.vsBest1(money(saving), chainName(one.id))}</div>` : ''}
      ${best.parts.map(p => `
        <div class="chain-block">
          <h3><span>${esc(chainName(p.chainId))}</span><span class="ltr">${money(p.goods + p.fee)}</span></h3>
          ${p.lines.map(l => `
            <div class="line"><span class="nm"><span class="he">${esc(itemInfo(l.barcode).name)}</span> × ${l.qty}
              ${l.deal ? `<span class="deal-note he">${esc(l.deal.text)}${l.deal.club ? ' · ' + L.clubDeal : ''}</span>` : ''}</span>
              <span class="ltr">${money(l.cost)}</span></div>`).join('')}
          ${p.fee ? `<div class="line"><span class="nm">${L.delivery}</span><span class="ltr">${money(p.fee)}</span></div>` : ''}
        </div>`).join('')}`;
  }
  document.getElementById('mbarRight').textContent = best ? money(best.total) : '';
  cmpPanel.hidden = false;
  const bestOne = cmp.find(c => c.missing === 0);
  document.getElementById('cmp').innerHTML = cmp.map(c => `
    <tr><td>${esc(chainName(c.id))}</td>
      <td class="ltr ${bestOne && c.id === bestOne.id ? 'best' : ''}">${money(c.total)}</td>
      <td>${c.missing || '—'}</td></tr>`).join('');
}

// ---------- события ----------
let st;
document.getElementById('q').oninput = e => {
  clearTimeout(st);
  st = setTimeout(() => { view.q = e.target.value.trim(); loadList(false); }, 250);
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-inc],[data-dec],[data-cat],[data-chain],#dealsChip');
  if (!el) return;
  if (el.dataset.inc) return setQty(el.dataset.inc, (basket[el.dataset.inc] || 0) + 1);
  if (el.dataset.dec) return setQty(el.dataset.dec, (basket[el.dataset.dec] || 0) - 1);
  if (el.id === 'dealsChip') { view.deals = !view.deals; drawChainChips(); return loadList(false); }
  if ('cat' in el.dataset) { view.category = el.dataset.cat || null; drawCats(); return loadList(false); }
  if ('chain' in el.dataset) { view.chain = el.dataset.chain || null; drawChainChips(); loadCats(); return loadList(false); }
});
document.getElementById('more').onclick = () => loadList(true);
document.getElementById('clear').onclick = () => { basket = {}; store('basket', basket); drawBasket(); drawList(); refreshBasketData(); };

// перетаскивание карточки в корзину
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.card'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.barcode); e.dataTransfer.effectAllowed = 'copy'; c.classList.add('dragging');
});
document.addEventListener('dragend', e => e.target.closest?.('.card')?.classList.remove('dragging'));
const drop = document.getElementById('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  const b = e.dataTransfer.getData('text/plain'); if (b) setQty(b, (basket[b] || 0) + 1);
});

document.getElementById('chainsTable').addEventListener('input', e => {
  const el = e.target; if (!el.dataset.c) return;
  cfg(el.dataset.c)[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value;
  store('basketSettings', settings); drawPlan();
});
document.getElementById('deliveries').onchange = e => { settings.deliveries = e.target.value; store('basketSettings', settings); drawPlan(); };
document.getElementById('date').onchange = () => drawPlan();
document.getElementById('mbar').onclick = () => document.getElementById('side').classList.add('open');
document.getElementById('closeSheet').onclick = () => document.getElementById('side').classList.remove('open');
document.getElementById('lang').onclick = () => {
  lang = lang === 'ru' ? 'he' : 'ru'; L = T[lang]; store('basketLang', lang);
  drawStatic(); drawChainChips(); drawCats(); drawList(); drawBasket(); drawChainsTable(); drawPlan();
};

(async function init() {
  document.getElementById('deliveries').value = String(settings.deliveries || 2);
  document.getElementById('date').value = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  if (window.matchMedia('(min-width: 901px)').matches && !Object.keys(basket).length) document.getElementById('settingsBox').open = false;
  drawStatic(); drawBasket();
  try {
    data = await rpc('g_basket', { p_barcodes: Object.keys(basket) });
    chains = (data.chains || []).sort((a, b) => a.name.localeCompare(b.name));
    drawStatic(); drawChainChips(); drawChainsTable(); drawBasket(); drawPlan();
    await Promise.all([loadCats(), loadList(false)]);
  } catch (e) { document.getElementById('meta').textContent = 'Ошибка загрузки: ' + e.message; }
})();
</script>
