<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sali — фото всех рецептов</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Heebo,system-ui,sans-serif;background:#fff;color:#151515}
header{padding:18px 16px 6px;max-width:1280px;margin:0 auto}h1{font:900 26px/1.1 Heebo,sans-serif;margin:0 0 4px}
header p{margin:0;color:#5C5C5C;font-size:14px}
nav{position:sticky;top:0;background:#fff;z-index:2;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid #eee}
nav button{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid #E6E6E6;background:#fff;font:700 14px Heebo,sans-serif;color:#151515;cursor:pointer}
nav button.on{background:#151515;color:#fff;border-color:#151515}
main{max-width:1280px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
figure{margin:0;border-radius:16px;overflow:hidden;border:1px solid #ECECEC}
figure img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#F2EEE6}
figcaption{padding:8px 10px 10px;font:700 14px/1.25 Heebo,sans-serif}
figcaption span{display:block;font:600 12px Heebo,sans-serif;color:#5C5C5C;margin-top:2px}
.none{display:grid;place-items:center;aspect-ratio:4/3;background:#F2EEE6;color:#7A6A50;font:700 13px Heebo,sans-serif}
</style></head><body>
<header><h1>Фото всех рецептов</h1><p id="sub">Загружаем…</p></header>
<nav id="tabs"></nav>
<main id="grid"></main>
<script>
const URL_='https://iavsoiirixtvkcszzfzd.supabase.co', KEY='sb_publishable_iyk2egos5cGAWztXikEigA_gfIlzAWr';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['все','завтрак','в школу','обед','ужин','перекус'];
let all=[],cur='все';
function draw(){
  const list=cur==='все'?all:all.filter(r=>(r.meals||[]).includes(cur));
  document.getElementById('tabs').innerHTML=CATS.map(c=>{const n=c==='все'?all.length:all.filter(r=>(r.meals||[]).includes(c)).length;
    return `<button class="${c===cur?'on':''}" data-c="${c}">${c==='в школу'?'В школу / сад':c[0].toUpperCase()+c.slice(1)} · ${n}</button>`}).join('');
  document.getElementById('grid').innerHTML=list.map(r=>`<figure>${r.image_url?`<img loading="lazy" src="${esc(r.image_url)}" alt="${esc(r.name)}">`:'<div class="none">фото ещё делается</div>'}
    <figcaption>${esc(r.name)}<span>${r.cook_minutes?r.cook_minutes+' мин · ':''}${esc((r.meals||[]).join(', '))}</span></figcaption></figure>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.c;draw();scrollTo({top:0})});
}
fetch(URL_+'/rest/v1/rpc/menu_library',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}'})
 .then(r=>r.json()).then(d=>{all=d;document.getElementById('sub').textContent=`${d.filter(r=>r.image_url).length} фото из ${d.length} рецептов · Nano Banana 2.1, один стиль на все`;draw();})
 .catch(e=>document.getElementById('sub').textContent='Не загрузилось: '+e.message);
</script></body></html>
