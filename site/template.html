<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скидки сегодня — детские товары в Израиле</title>
<meta name="description" content="Свежие скидки на игрушки и детские товары в израильских магазинах. Обновляется каждый день.">
<style>
  :root {
    --bg: #fbf7f2;
    --card: #ffffff;
    --ink: #24201c;
    --muted: #7a7068;
    --line: #ece4da;
    --accent: #e8573f;
    --accent-ink: #ffffff;
    --vip: #6b4fd8;
    --chip: #f3ece4;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    padding: 28px 20px 8px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 42px);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); margin-top: 6px; }

  .controls {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .controls-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 12px 20px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 7px 14px;
    border-radius: 999px;
    font: inherit; font-size: 14px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip .n { opacity: .6; margin-inline-start: 4px; }
  .spacer { flex: 1; }
  select, input[type=search] {
    font: inherit; font-size: 14px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 7px 14px;
  }
  input[type=search] { min-width: 180px; }
  label.toggle { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; flex-direction: column;
    text-decoration: none; color: inherit;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(60, 40, 20, .08); }
  .img {
    position: relative;
    aspect-ratio: 1 / 1;
    background: #fff;
    display: grid; place-items: center;
    border-bottom: 1px solid var(--line);
  }
  .img img { width: 86%; height: 86%; object-fit: contain; }
  .img .ph { font-size: 40px; opacity: .25; }
  .badge {
    position: absolute; top: 10px; inset-inline-start: 10px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 14px;
    padding: 4px 9px; border-radius: 999px;
  }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .store { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .name {
    font-size: 14px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    flex: 1;
  }
  .prices { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .price { font-size: 20px; font-weight: 700; }
  .old { color: var(--muted); text-decoration: line-through; font-size: 14px; }
  .age {
    position: absolute; top: 10px; inset-inline-end: 10px;
    background: #fff; color: var(--ink); border: 1px solid var(--line);
    font-size: 12px; font-weight: 600;
    padding: 3px 8px; border-radius: 999px;
  }
  .row2 { max-width: 1200px; margin: 0 auto; padding: 0 20px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row2 .lbl { font-size: 13px; color: var(--muted); margin-inline-end: 4px; }
  .promo {
    align-self: flex-start;
    font-size: 12px; font-weight: 600;
    color: var(--vip); background: color-mix(in srgb, var(--vip) 10%, white);
    padding: 3px 8px; border-radius: 6px;
  }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { max-width: 1200px; margin: 0 auto; padding: 10px 20px 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Скидки <span>сегодня</span></h1>
  <div class="meta" id="meta"></div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div id="stores" style="display:contents"></div>
    <div class="spacer"></div>
    <input type="search" id="q" placeholder="Поиск: lego, слайм…" aria-label="Поиск">
    <select id="sort" aria-label="Сортировка">
      <option value="discount">Сначала большие скидки</option>
      <option value="cheap">Сначала дешёвые</option>
      <option value="expensive">Сначала дорогие</option>
    </select>
    <label class="toggle"><input type="checkbox" id="novip"> без клубных цен</label>
  </div>
  <div class="row2"><span class="lbl">Возраст:</span><div id="ages" style="display:contents"></div></div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Ничего не нашлось. Попробуй другой поиск или магазин.</div>
</main>

<footer>
  Цены собираются автоматически с сайтов магазинов раз в день и могут измениться. Проверяйте цену на сайте магазина перед покупкой.
  Клубные цены (например, LEGO VIP) доступны только членам клуба магазина.
</footer>

<script>
const DATA = /*__DEALS__*/null;

const fmt = n => n == null ? '' : '₪' + Number(n).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
const isClub = d => !!d.promo && /VIP|клуб/i.test(d.promo);
const deals = (DATA && DATA.deals) || [];
const state = { store: 'all', age: 'all', q: '', sort: 'discount', novip: false };

// Возрастные группы фильтра: [от, до) в годах
const AGES = [
  { id: '0-1', label: 'до 1 года', from: 0, to: 1 },
  { id: '1-3', label: '1–3', from: 1, to: 3 },
  { id: '3-5', label: '3–5', from: 3, to: 5 },
  { id: '5-8', label: '5–8', from: 5, to: 8 },
  { id: '8-12', label: '8–12', from: 8, to: 12 },
  { id: '12-18', label: '12+', from: 12, to: 18 },
  { id: '18', label: 'взрослым', from: 18, to: 200 },
];
const hasAge = d => d.age_min != null;
function fitsAge(d, g) {
  if (!hasAge(d)) return false;
  // «4+» у детского товара — это до 18, а не «и взрослым тоже»
  const hi = d.age_max != null ? d.age_max : (d.age_min >= 18 ? Infinity : 18);
  return d.age_min < g.to && hi > g.from;
}
function ageText(d) {
  if (!hasAge(d)) return '';
  const n = x => String(x).replace('.5', '½').replace(/\.0$/, '');
  if (d.age_max == null) return n(d.age_min) + '+';
  if (d.age_max <= 1) return 'до 1 года';
  return n(d.age_min) + '–' + n(d.age_max);
}

function updatedText() {
  if (!DATA || !DATA.updated_at) return '';
  const d = new Date(DATA.updated_at);
  return 'Обновлено ' + d.toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jerusalem' });
}

function renderStores() {
  const counts = {};
  deals.forEach(d => counts[d.store] = (counts[d.store] || 0) + 1);
  const box = document.getElementById('stores');
  const mk = (id, label, n) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', state.store === id);
    b.innerHTML = '';
    b.append(label);
    const s = document.createElement('span'); s.className = 'n'; s.textContent = n; b.append(s);
    b.onclick = () => { state.store = id; renderStores(); renderAges(); render(); };
    return b;
  };
  box.replaceChildren(mk('all', 'Все', deals.length), ...Object.keys(counts).map(s => mk(s, s, counts[s])));
}

function renderAges() {
  const box = document.getElementById('ages');
  const base = deals.filter(d => state.store === 'all' || d.store === state.store);
  const mk = (id, label, n) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', state.age === id);
    b.append(label);
    const s = document.createElement('span'); s.className = 'n'; s.textContent = n; b.append(s);
    b.onclick = () => { state.age = id; renderAges(); render(); };
    return b;
  };
  box.replaceChildren(
    mk('all', 'любой', base.length),
    ...AGES.map(g => mk(g.id, g.label, base.filter(d => fitsAge(d, g)).length)).filter(b => b.querySelector('.n').textContent !== '0')
  );
}

function render() {
  const q = state.q.trim().toLowerCase();
  let list = deals.filter(d =>
    (state.store === 'all' || d.store === state.store) &&
    (state.age === 'all' || fitsAge(d, AGES.find(g => g.id === state.age))) &&
    (!state.novip || !isClub(d)) &&
    (!q || d.name.toLowerCase().includes(q))
  );
  const by = {
    discount: (a, b) => (b.discount_percent || 0) - (a.discount_percent || 0),
    cheap: (a, b) => a.price - b.price,
    expensive: (a, b) => b.price - a.price,
  }[state.sort];
  list = list.slice().sort(by);

  const grid = document.getElementById('grid');
  grid.replaceChildren(...list.map(d => {
    const a = document.createElement('a');
    a.className = 'card'; a.href = d.url || '#'; a.target = '_blank'; a.rel = 'noopener';

    const img = document.createElement('div'); img.className = 'img';
    if (d.image) {
      const i = document.createElement('img');
      i.src = d.image.replace(/^\/\//, 'https://'); i.alt = ''; i.loading = 'lazy';
      i.onerror = () => {
        const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = '🧸';
        i.replaceWith(ph);
      };
      img.append(i);
    } else {
      const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = '🧸'; img.append(ph);
    }
    if (d.discount_percent) {
      const b = document.createElement('div'); b.className = 'badge'; b.textContent = '−' + d.discount_percent + '%'; img.append(b);
    }
    if (hasAge(d)) {
      const ag = document.createElement('div'); ag.className = 'age'; ag.textContent = ageText(d); img.append(ag);
    }

    const body = document.createElement('div'); body.className = 'body';
    const st = document.createElement('div'); st.className = 'store'; st.textContent = d.store;
    const nm = document.createElement('div'); nm.className = 'name'; nm.dir = 'auto'; nm.textContent = d.name;
    const pr = document.createElement('div'); pr.className = 'prices';
    const p1 = document.createElement('span'); p1.className = 'price'; p1.textContent = fmt(d.price);
    pr.append(p1);
    if (d.old_price) { const p2 = document.createElement('span'); p2.className = 'old'; p2.textContent = fmt(d.old_price); pr.append(p2); }
    body.append(st, nm, pr);
    if (d.promo) { const pm = document.createElement('span'); pm.className = 'promo'; pm.dir = 'auto'; pm.textContent = d.promo; body.append(pm); }

    a.append(img, body);
    return a;
  }));
  document.getElementById('empty').hidden = list.length > 0;
  document.getElementById('meta').textContent =
    [updatedText(), list.length + ' ' + plural(list.length, 'товар', 'товара', 'товаров') + ' со скидкой'].filter(Boolean).join(' · ');
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

document.getElementById('q').oninput = e => { state.q = e.target.value; render(); };
document.getElementById('sort').onchange = e => { state.sort = e.target.value; render(); };
document.getElementById('novip').onchange = e => { state.novip = e.target.checked; render(); };
renderStores();
renderAges();
render();
</script>
</body>
</html>
