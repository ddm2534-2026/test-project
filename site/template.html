<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מבצעים היום — מוצרי ילדים בישראל</title>
<meta name="description" content="מבצעים טריים על צעצועים ומוצרי ילדים בחנויות בישראל. מתעדכן כל יום.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf7f2;
    --card: #ffffff;
    --ink: #24201c;
    --muted: #7a7068;
    --line: #e6ddd2;
    --accent: #e0503a;
    --vip: #5b3fc8;
    --good: #22704a;
    --radius: 18px;
    --pad: 20px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 Rubik, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding-inline: var(--pad); }

  header.wrap { padding-top: 26px; padding-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .eyebrow { font-size: 13px; font-weight: 500; color: var(--muted); min-height: 1.2em; }
  h1 { margin: 4px 0 0; font-size: clamp(34px, 5vw, 46px); line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); margin-top: 6px; font-size: 14px; }
  .lang { flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--card); font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; }

  .controls {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #ece4da;
  }
  .controls .wrap { padding-top: 8px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
  .search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: var(--card);
            border: 1px solid var(--line); border-radius: 14px; max-width: 520px; }
  .search:focus-within { border-color: var(--ink); }
  .search input { border: 0; outline: 0; font: inherit; font-size: 15px; flex: 1; min-width: 0; background: transparent; color: var(--ink); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row .lbl { font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .chip {
    flex-shrink: 0; white-space: nowrap;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    height: 36px; padding: 0 14px; border-radius: 999px;
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .row.small .chip { height: 32px; font-size: 13px; padding: 0 12px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip .n { opacity: .55; font-size: .9em; }

  main.wrap { padding-top: 16px; padding-bottom: 28px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar select {
    font: inherit; font-size: 15px; font-weight: 700; color: var(--ink);
    border: 0; background: transparent; padding: 6px 0; cursor: pointer; max-width: 100%;
  }
  label.toggle { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; min-height: 36px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column; text-decoration: none; color: inherit;
    box-shadow: 0 1px 0 #ece4da, 0 6px 18px rgba(60, 40, 20, .06);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 1px 0 #ece4da, 0 12px 28px rgba(60, 40, 20, .12); }
  .img { position: relative; aspect-ratio: 1 / 1; background: #fff; display: grid; place-items: center; }
  .img img { width: 86%; height: 86%; object-fit: contain; }
  .img .ph { width: 54px; height: 54px; color: rgba(36, 32, 28, .25); }
  .badge {
    position: absolute; top: 8px; inset-inline-start: 8px;
    background: var(--accent); color: #fff;
    font-weight: 800; font-size: 15px; padding: 4px 9px; border-radius: 10px;
  }
  .age {
    position: absolute; bottom: 8px; left: 8px;
    background: #fff; color: var(--ink); box-shadow: 0 0 0 1px #ece4da;
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
  }
  html[dir=ltr] .age { left: auto; right: 8px; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .store { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .03em; }
  .name {
    font-size: 13.5px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .prices { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; }
  .price { font-size: 19px; font-weight: 800; }
  .old { color: var(--muted); text-decoration: line-through; font-size: 12px; }
  .price, .old { unicode-bidi: isolate; direction: ltr; }
  .promo { align-self: flex-start; font-size: 11px; font-weight: 600; color: var(--vip); background: #efebfc; padding: 3px 7px; border-radius: 6px; }
  .cheaper { font-size: 11.5px; color: var(--good); }
  .pricier { font-size: 11.5px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .more { display: block; margin: 24px auto 0; height: 46px; padding: 0 26px; font: inherit; font-size: 15px; font-weight: 500;
          border-radius: 999px; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; }
  .more[hidden] { display: none; }
  .loading { opacity: .5; transition: opacity .2s; }
  footer.wrap { padding-bottom: 40px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }

  @media (max-width: 640px) {
    :root { --pad: 18px; }
    .search { max-width: none; }
    /* на телефоне ряды фильтров листаются вбок, а не переносятся */
    .row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--pad)); padding-inline: var(--pad); }
    .row::-webkit-scrollbar { display: none; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  }
</style>
</head>
<body>
<header class="wrap">
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <div class="meta" id="meta"></div>
  </div>
  <button class="lang" id="lang"></button>
</header>

<div class="controls">
  <div class="wrap">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a7068" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q">
    </label>
    <div class="row" id="stores"></div>
    <div class="row small"><span class="lbl" id="ageLabel"></span><div id="ages" style="display:contents"></div></div>
  </div>
</div>

<main class="wrap">
  <div class="toolbar">
    <select id="sort"></select>
    <label class="toggle"><input type="checkbox" id="novip"> <span id="novipLabel"></span></label>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <button class="more" id="more" hidden></button>
</main>

<footer class="wrap" id="footer"></footer>

<script>
// Публичный ключ: даёт только чтение каталога (права настроены в базе)
const SUPABASE_URL = '/*__SUPABASE_URL__*/';
const SUPABASE_KEY = '/*__SUPABASE_KEY__*/';
const PAGE = 48;

const T = {
  he: {
    dir: 'rtl', locale: 'he-IL', title: 'מבצעים היום — מוצרי ילדים בישראל',
    h1: 'מבצעים <span>היום</span>', loading: 'טוען…', all: 'הכל', search: 'חיפוש: לגו, סליים…',
    sort: ['ההנחות הגדולות קודם', 'הזול ביותר קודם', 'היקר ביותר קודם'], noClub: 'בלי מחירי מועדון',
    age: 'גיל:', anyAge: 'כל גיל', ages: ['0–1', '1–3', '3–5', '5–8', '8–12', '12+', 'למבוגרים'],
    empty: 'לא נמצאו מוצרים. נסו חיפוש, חנות או גיל אחרים.', more: 'עוד מוצרים',
    updated: d => 'עודכן ' + d, count: n => n + ' מוצרים במבצע',
    cheaper: (s, p) => `✓ זול יותר מאשר ב־\u2068${s}\u2069 (\u2066${p}\u2069)`, pricier: (s, p) => `ב־\u2068${s}\u2069 זול יותר: \u2066${p}\u2069`,
    club: 'מחיר מועדון', upToYear: 'עד שנה', error: 'לא הצלחנו לטעון את המבצעים, נסו לרענן את העמוד.',
    footer: 'המחירים נאספים אוטומטית מאתרי החנויות פעם ביום ועשויים להשתנות — בדקו את המחיר באתר החנות לפני הרכישה. ' +
            '״מחיר קודם״ הוא המחיר שהחנות עצמה מציינת. מחירי מועדון (למשל LEGO VIP) זמינים לחברי מועדון החנות בלבד.',
    eyebrow: n => `צעצועים ומוצרי תינוקות · ${n} חנויות`,
    switchTo: 'Русский',
  },
  ru: {
    dir: 'ltr', locale: 'ru-RU', title: 'Скидки сегодня — детские товары в Израиле',
    h1: 'Скидки <span>сегодня</span>', loading: 'Загружаем…', all: 'Все', search: 'Поиск: lego, слайм…',
    sort: ['Сначала большие скидки', 'Сначала дешёвые', 'Сначала дорогие'], noClub: 'без клубных цен',
    age: 'Возраст:', anyAge: 'любой', ages: ['0–1', '1–3', '3–5', '5–8', '8–12', '12+', 'взрослым'],
    empty: 'Ничего не нашлось. Попробуй другой поиск, магазин или возраст.', more: 'Показать ещё',
    updated: d => 'Обновлено ' + d,
    count: n => n + ' ' + plural(n, 'товар', 'товара', 'товаров') + ' со скидкой',
    cheaper: (s, p) => `✓ дешевле, чем в ${s} (${p})`, pricier: (s, p) => `в ${s} дешевле: ${p}`,
    club: 'Клубная цена', upToYear: 'до 1 года', error: 'Не удалось загрузить скидки, попробуйте обновить страницу.',
    footer: 'Цены собираются автоматически с сайтов магазинов раз в день и могут измениться. Проверяйте цену на сайте магазина перед покупкой. ' +
            '«Было» — цена, которую указывает сам магазин. Клубные цены (например, LEGO VIP) доступны только членам клуба магазина.',
    eyebrow: n => `Игрушки и товары для малышей · ${n} ` + plural(n, 'магазин', 'магазина', 'магазинов'),
    switchTo: 'עברית',
  },
};
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function initialLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'ru' || q === 'he') return q;
  try { const s = localStorage.getItem('lang'); if (s === 'ru' || s === 'he') return s; } catch (e) {}
  return 'he';
}
let lang = initialLang();
let L = T[lang];

const AGES = [
  { id: '0-1', from: 0, to: 1 }, { id: '1-3', from: 1, to: 3 }, { id: '3-5', from: 3, to: 5 },
  { id: '5-8', from: 5, to: 8 }, { id: '8-12', from: 8, to: 12 }, { id: '12-18', from: 12, to: 18 },
  { id: '18', from: 18, to: 200 },
];
const state = { store: null, age: null, q: '', sort: 'discount', novip: false, offset: 0, total: 0 };
let facetsAll = null, facetsCur = null, reqId = 0;

function applyLang() {
  L = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = L.dir;
  document.title = L.title;
  document.getElementById('h1').innerHTML = L.h1;
  document.getElementById('q').placeholder = L.search;
  document.getElementById('q').setAttribute('aria-label', L.search);
  const sort = document.getElementById('sort');
  sort.replaceChildren(...['discount', 'cheap', 'expensive'].map((v, i) => {
    const o = document.createElement('option'); o.value = v; o.textContent = L.sort[i]; o.selected = state.sort === v; return o;
  }));
  document.getElementById('novipLabel').textContent = L.noClub;
  document.getElementById('ageLabel').textContent = L.age;
  document.getElementById('empty').textContent = L.empty;
  document.getElementById('more').textContent = L.more;
  document.getElementById('footer').textContent = L.footer;
  document.getElementById('lang').textContent = L.switchTo;
}

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

const fmt = n => {
  if (n == null) return '';
  const whole = Number(n) % 1 === 0;
  return new Intl.NumberFormat(L.locale, { style: 'currency', currency: 'ILS',
    minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }).format(n);
};
function ageText(d) {
  if (d.age_min == null) return '';
  const n = x => String(Number(x)).replace('.5', '½');
  if (d.age_max == null) return n(d.age_min) + '+';
  if (Number(d.age_max) <= 1) return L.upToYear;
  return n(d.age_min) + '–' + n(d.age_max);
}
function promoText(p) {
  if (!p) return '';
  const m = p.match(/LEGO VIP/i);
  return m ? `${L.club}: LEGO VIP` : p;
}

function chip(label, n, pressed, onclick) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.setAttribute('aria-pressed', pressed);
  const lb = document.createElement('bdi'); lb.textContent = label; b.append(lb);
  if (n != null) { const s = document.createElement('bdi'); s.className = 'n'; s.textContent = n; b.append(' ', s); }
  b.onclick = onclick;
  return b;
}

function drawFilters() {
  if (!facetsAll) return;
  const f = facetsCur || facetsAll;
  document.getElementById('stores').replaceChildren(
    chip(L.all, facetsAll.total, !state.store, () => { state.store = null; refresh(true); }),
    ...(facetsAll.stores || []).map(s => chip(s.name, s.n, state.store === s.id, () => { state.store = s.id; refresh(true); }))
  );
  document.getElementById('ages').replaceChildren(
    chip(L.anyAge, f.total, !state.age, () => { state.age = null; refresh(false); }),
    ...AGES.map((g, i) => [g, i]).filter(([g]) => (f.ages || {})[g.id] > 0)
           .map(([g, i]) => chip(L.ages[i], f.ages[g.id], state.age === g.id, () => { state.age = g.id; refresh(false); }))
  );
}

async function renderFilters() {
  if (!facetsAll) facetsAll = await rpc('deal_facets', {});
  facetsCur = state.store ? await rpc('deal_facets', { p_store: state.store }) : facetsAll;
  drawFilters();
}

function drawMeta() {
  if (facetsAll && facetsAll.stores) document.getElementById('eyebrow').textContent = L.eyebrow(facetsAll.stores.length);
  if (state.error) { document.getElementById('meta').textContent = L.error; return; }
  const parts = [];
  if (facetsAll && facetsAll.updated) {
    parts.push(L.updated(new Date(facetsAll.updated + 'T12:00:00').toLocaleDateString(L.locale, { day: 'numeric', month: 'long' })));
  }
  if (state.loaded) parts.push(L.count(state.total));
  document.getElementById('meta').textContent = parts.join(' · ') || L.loading;
}

const PH = '<svg class="ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zm0 0c2-4 6-4 6-1s-6 1-6 1z"/></svg>';
function card(d) {
  const a = document.createElement('a');
  a.className = 'card'; a.href = d.url || '#'; a.target = '_blank'; a.rel = 'noopener';
  const img = document.createElement('div'); img.className = 'img';
  if (d.image) {
    const i = document.createElement('img');
    i.src = d.image.replace(/^\/\//, 'https://'); i.alt = ''; i.loading = 'lazy';
    i.onerror = () => { i.remove(); img.insertAdjacentHTML('afterbegin', PH); };
    img.append(i);
  } else { img.insertAdjacentHTML('afterbegin', PH); }
  if (d.discount_percent) { const b = document.createElement('div'); b.className = 'badge'; b.dir = 'ltr'; b.textContent = '−' + d.discount_percent + '%'; img.append(b); }
  const at = ageText(d);
  if (at) { const ag = document.createElement('div'); ag.className = 'age'; ag.dir = 'ltr'; ag.textContent = at; img.append(ag); }

  const body = document.createElement('div'); body.className = 'body';
  const st = document.createElement('div'); st.className = 'store'; st.textContent = d.store_name;
  const nm = document.createElement('div'); nm.className = 'name'; nm.dir = 'auto'; nm.textContent = d.name;
  const pr = document.createElement('div'); pr.className = 'prices';
  const p1 = document.createElement('span'); p1.className = 'price'; p1.textContent = fmt(d.price); pr.append(p1);
  if (d.old_price) { const p2 = document.createElement('span'); p2.className = 'old'; p2.textContent = fmt(d.old_price); pr.append(p2); }
  body.append(st, nm, pr);
  if (d.best_elsewhere != null) {
    const diff = Number(d.best_elsewhere) - Number(d.price);
    const c = document.createElement('div');
    if (diff > 0) { c.className = 'cheaper'; c.textContent = L.cheaper(d.best_elsewhere_store, fmt(d.best_elsewhere)); }
    else if (diff < 0) { c.className = 'pricier'; c.textContent = L.pricier(d.best_elsewhere_store, fmt(d.best_elsewhere)); }
    if (c.textContent) body.append(c);
  }
  if (d.promo) { const pm = document.createElement('span'); pm.className = 'promo'; pm.textContent = promoText(d.promo); body.append(pm); }
  a.append(img, body);
  return a;
}

let rows = [];
async function load(append) {
  const my = ++reqId;
  const g = AGES.find(x => x.id === state.age);
  const grid = document.getElementById('grid');
  grid.classList.add('loading');
  try {
    const page = await rpc('search_deals', {
      p_store: state.store, p_age_from: g ? g.from : null, p_age_to: g ? g.to : null,
      p_q: state.q.trim() || null, p_sort: state.sort, p_no_club: state.novip,
      p_limit: PAGE, p_offset: state.offset,
    });
    if (my !== reqId) return;  // пришёл ответ на устаревший запрос
    state.error = false; state.loaded = true;
    state.total = page.length ? Number(page[0].total) : (append ? state.total : 0);
    rows = append ? rows.concat(page) : page;
    append ? grid.append(...page.map(card)) : grid.replaceChildren(...page.map(card));
    state.offset += page.length;
    document.getElementById('empty').hidden = state.total > 0;
    document.getElementById('more').hidden = state.offset >= state.total;
  } catch (e) {
    if (my === reqId) state.error = true;
  } finally {
    if (my === reqId) { grid.classList.remove('loading'); drawMeta(); }
  }
}

async function refresh(filtersToo) {
  state.offset = 0;
  if (filtersToo) await renderFilters().catch(() => {});
  else renderFilters().catch(() => {});
  return load(false);
}

document.getElementById('lang').onclick = () => {
  lang = lang === 'he' ? 'ru' : 'he';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang(); drawFilters(); drawMeta();
  document.getElementById('grid').replaceChildren(...rows.map(card));
};
let t;
document.getElementById('q').oninput = e => { state.q = e.target.value; clearTimeout(t); t = setTimeout(() => refresh(false), 300); };
document.getElementById('sort').onchange = e => { state.sort = e.target.value; refresh(false); };
document.getElementById('novip').onchange = e => { state.novip = e.target.checked; refresh(false); };
document.getElementById('more').onclick = () => load(true);
applyLang();
drawMeta();
refresh(true);
</script>
</body>
</html>
